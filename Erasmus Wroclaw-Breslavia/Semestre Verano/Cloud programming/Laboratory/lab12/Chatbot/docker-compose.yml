services:

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot / Gradle
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatapp-backend
    ports:
      - "5000:5000"
    networks:
      - chatapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/chat/all?username=healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend — SvelteKit / Node
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tells the frontend where to reach the backend.
        # Inside compose networking the backend is reachable by its service name,
        # but the *browser* calls it via the host machine, so we use localhost here.
        PUBLIC_API_BASE_URL: http://localhost:5000/
    container_name: chatapp-frontend
    ports:
      - "3000:3000"
    networks:
      - chatapp-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  chatapp-network:
    driver: bridge
