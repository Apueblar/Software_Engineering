dbt-mssql:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: localhost
      port: 1433
      database: StarSchema
      schema: Staging          # dbt writes all models into AWStaging.[Staging]
      trusted_connection: yes
      encrypt: false
      TrustServerCertificate: true