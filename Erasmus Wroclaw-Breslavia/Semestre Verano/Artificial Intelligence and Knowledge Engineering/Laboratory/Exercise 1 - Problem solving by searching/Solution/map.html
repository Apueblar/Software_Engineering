<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Koleje Dolnośląskie - Network Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;600&display=swap');

  /* ── CSS theme variables ── */
  :root {
    --bg:           #0a0e1a;
    --header-bg:    #0d1220;
    --header-bg2:   #111827;
    --border:       #1e2740;
    --text:         #e8eaf0;
    --text-muted:   #6b7a99;
    --text-dim:     #4a556e;
    --sidebar-bg:   rgba(10,14,26,0.92);
    --input-bg:     #111827;
    --input-text:   #c8ccda;
    --item-hover:   rgba(255,255,255,0.04);
    --item-active:  rgba(255,255,255,0.07);
    --toggle-off:   #1e2740;
    --popup-bg:     #0d1220;
    --popup-border: #1e2740;
    --popup-text:   #e8eaf0;
    --accent:       #f6c32f;
    --stop-color:   #f6c32f;
    --scrollbar:    #1e2740;
  }
  body.light {
    --bg:           #f0f2f8;
    --header-bg:    #ffffff;
    --header-bg2:   #f5f7fc;
    --border:       #d0d6e8;
    --text:         #1a1f2e;
    --text-muted:   #5a6480;
    --text-dim:     #8892aa;
    --sidebar-bg:   rgba(255,255,255,0.95);
    --input-bg:     #f5f7fc;
    --input-text:   #2a3040;
    --item-hover:   rgba(0,0,0,0.04);
    --item-active:  rgba(0,0,0,0.07);
    --toggle-off:   #c8d0e0;
    --popup-bg:     #ffffff;
    --popup-border: #d0d6e8;
    --popup-text:   #1a1f2e;
    --accent:       #c89a00;
    --stop-color:   #d4920a;
    --scrollbar:    #c8d0e0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 24px;
    background: linear-gradient(135deg, var(--header-bg) 0%, var(--header-bg2) 100%);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
    flex-shrink: 0;
    transition: background 0.3s, border-color 0.3s;
  }
  .header-badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(246,195,47,0.12);
    border: 1px solid rgba(246,195,47,0.3);
    padding: 4px 10px;
    border-radius: 4px;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  .stats {
    display: flex;
    gap: 20px;
    margin-left: auto;
    align-items: center;
  }
  .stat {
    text-align: right;
  }
  .stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stat-lbl {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ── Theme toggle button ── */
  #theme-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    white-space: nowrap;
  }
  #theme-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  #theme-btn .icon { font-size: 14px; line-height: 1; }

  /* ── Map container ── */
  #map {
    flex: 1;
    width: 100%;
  }

  /* ── Sidebar / legend ── */
  #sidebar {
    position: absolute;
    top: 74px;
    right: 12px;
    width: 240px;
    max-height: calc(100vh - 110px);
    background: var(--sidebar-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    backdrop-filter: blur(12px);
    z-index: 900;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s, border-color 0.3s;
  }
  #sidebar-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  #filter-input {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--input-text);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    margin: 8px 14px 0;
    width: calc(100% - 28px);
    transition: background 0.3s, border-color 0.3s;
  }
  #filter-input:focus { border-color: #3b5bdb; }
  #route-list {
    overflow-y: auto;
    padding: 8px 0 12px;
    flex: 1;
  }
  .route-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .route-item:hover { background: var(--item-hover); }
  .route-item.active { background: var(--item-active); }
  .route-toggle {
    margin-left: auto;
    width: 28px;
    height: 14px;
    background: var(--toggle-off);
    border-radius: 7px;
    position: relative;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .route-toggle.on { background: #3b5bdb; }
  .route-toggle::after {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    top: 2px; left: 2px;
    transition: left 0.2s;
  }
  .route-toggle.on::after { left: 16px; }

  /* ── Popup theming ── */
  .leaflet-popup-content-wrapper {
    background: var(--popup-bg);
    color: var(--popup-text);
    border: 1px solid var(--popup-border);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.3s;
  }
  .leaflet-popup-tip { background: var(--popup-bg); }
  .popup-stop-name {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .popup-stop-id {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ── Leaflet attribution - keep it legal but unobtrusive ── */
  .leaflet-control-attribution {
    font-size: 9px !important;
    opacity: 0.45;
    transition: opacity 0.2s;
  }
  .leaflet-control-attribution:hover {
    opacity: 1;
  }

  /* ── Brand color badge in sidebar ── */
  .route-line-swatch {
    width: 18px;
    height: 3px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .brand-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    opacity: 0.75;
    flex-shrink: 0;
    letter-spacing: 0.05em;
  }

  /* ── Stop popup route chips ── */
  .popup-routes {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .route-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 4px;
    border: 1.5px solid;
    white-space: nowrap;
  }
  .route-chip-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  /* ── Line click popup ── */
  .line-popup-name {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .line-popup-swatch {
    display: inline-block;
    width: 28px;
    height: 4px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .line-popup-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
    font-family: 'DM Sans', sans-serif;
  }

  /* Custom scrollbar */
  #route-list::-webkit-scrollbar { width: 4px; }
  #route-list::-webkit-scrollbar-track { background: transparent; }
  #route-list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
</style>
</head>

<header>

    <button id="theme-btn" title="Toggle light/dark map">

</header>

<div id="map"></div>

  <div id="route-list"></div>
</div>

701], [51.055049, 16.198447], [51.078997, 16.161272], [51.125139, 16.158692], [51.165275, 16.185372], [51.201674, 16.198056], [51.214097, 16.16967]]]}, {"name": "D8/D4/D91", "color": "#85F47A", "brand_color": "#F6C32F", "polylines": [[[51.304044, 17.063326], [51.276035, 17.094187], [51.233655, 17.118864], [51.20894, 17.109658], [51.193196, 17.098296], [51.168757, 17.108368], [51.158721, 17.122147], [51.150451, 17.118542], [51.142546, 17.083544], [51.125658, 17.03299], [51.122944, 17.014241], [51.1163, 16.998395], [51.097917, 17.037957], [51.069077, 17.032157], [51.061102, 16.997656], [51.036155, 16.975787], [51.010048, 16.952937], [50.97427, 16.926523], [50.965123, 16.899229], [50.954151, 16.857297], [50.934142, 16.75913], [50.90535, 16.740129], [50.907806, 16.700733], [50.911021, 16.661642], [50.898367, 16.625159], [50.876844, 16.586846], [50.856029, 16.530219], [50.835008, 16.503955], [50.841216, 16.481506], [50.859921, 16.479444], [50.887692, 16.464624], [50.912468, 16.428854], [50.930106, 16.374626], [50.974562, 16.358945], [51.008429, 16.325327], [51.014612, 16.301701], [51.055049, 16.198447]]]}];

// ── Map setup ────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [51.1, 16.9],
  zoom: 9,
  preferCanvas: true,
});

// ── Tile layers (dark + light) ──────────────────────────────────────────
// Attribution is required by CARTO's terms of service and cannot be removed.
// It is styled to be small and fades unless hovered (see CSS above).
const TILES = {
  dark: L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>', subdomains:'abcd', maxZoom:18 }
  ),
  light: L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    { attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>', subdomains:'abcd', maxZoom:18 }
  ),
};
TILES.dark.addTo(map);
let isDark = true;

// ── Theme switch ─────────────────────────────────────────────────────────
function applyTheme(dark) {
  isDark = dark;
  document.body.classList.toggle('light', !dark);
  // Swap tile layers
  if (dark) {
    map.removeLayer(TILES.light);
    TILES.dark.addTo(map);
    TILES.dark.bringToBack();
  } else {
    map.removeLayer(TILES.dark);
    TILES.light.addTo(map);
    TILES.light.bringToBack();
  }
  // Update stop marker color for contrast
  const stopCol = dark ? '#f6c32f' : '#d4920a';
  stopGroup.eachLayer(l => {
    l.setStyle({ color: stopCol, fillColor: stopCol });
  });
  // Update button label
  document.getElementById('theme-label').textContent = dark ? 'Dark' : 'Light';
  document.querySelector('#theme-btn .icon').textContent = dark ? '🌙' : '☀️';
}

document.getElementById('theme-btn').addEventListener('click', () => applyTheme(!isDark));

// ── Draw routes ───────────────────────────────────────────────────────────
const routeLayers = [];

ROUTES.forEach(route => {
  const layerGroup = L.layerGroup();
  route.polylines.forEach(coords => {
    const pl = L.polyline(coords, {
      color:   route.color,
      weight:  3,
      opacity: 0.85,
    });
    // Thicken on hover so the line is easier to click
    pl.on('mouseover', function() { this.setStyle({ weight: 5, opacity: 1 }); });
    pl.on('mouseout',  function() { this.setStyle({ weight: 3, opacity: 0.85 }); });
    // Click: show a popup with the line name + color swatch
    pl.on('click', function(e) {
      const hex = route.color;
      // Readable text color for the swatch label
      const r2 = parseInt(hex.slice(1,3),16), g2 = parseInt(hex.slice(3,5),16), b2 = parseInt(hex.slice(5,7),16);
      const lum = 0.2126*(r2/255)+0.7152*(g2/255)+0.0722*(b2/255);
      const txt = lum > 0.4 ? '#1a1a1a' : '#ffffff';
      L.popup({ className: 'line-click-popup' })
        .setLatLng(e.latlng)
        .setContent(
          `<div class="line-popup-name">
             <span class="line-popup-swatch" style="background:${route.color}"></span>
             <span style="color:${route.color}">${route.name}</span>
           </div>
           <div class="line-popup-label">Railway line</div>`
        )
        .openOn(map);
    });
    pl.addTo(layerGroup);
  });
  layerGroup.addTo(map);
  routeLayers.push({ name: route.name, color: route.color, brandColor: route.brand_color, layer: layerGroup, visible: true });
});

// ── Draw stops ────────────────────────────────────────────────────────────
const stopGroup = L.layerGroup().addTo(map);
const stopRadius = 3;

STOPS.forEach(stop => {
  const marker = L.circleMarker([stop.lat, stop.lon], {
    radius:      stopRadius,
    color:       '#f6c32f',
    fillColor:   '#f6c32f',
    fillOpacity: 0.8,
    weight:      0,
  });

  // Build route chips HTML
  // Text is always the route's own color - it's always readable against the
  // semi-transparent dark/light chip background, and keeps every chip distinct.
  let chipsHtml = '';
  if (stop.routes && stop.routes.length > 0) {
    const chips = stop.routes.map(rt => {
      const bgCol = rt.color + '22';   // 13% opacity tint of the route color
      return `<span class="route-chip" style="color:${rt.color};border-color:${rt.color};background:${bgCol}">
                <span class="route-chip-dot" style="background:${rt.color}"></span>
                ${rt.name}
              </span>`;
    }).join('');
    chipsHtml = `<div class="popup-routes">${chips}</div>`;
  } else {
    chipsHtml = `<div class="popup-stop-id" style="margin-top:5px">No active routes on this date</div>`;
  }

  marker.bindPopup(
    `<div class="popup-stop-name">${stop.name}</div>
     <div class="popup-stop-id">Stop ID: ${stop.id}</div>
     ${chipsHtml}`
  );
  marker.addTo(stopGroup);
});

// Scale markers with zoom
map.on('zoomend', () => {
  const z = map.getZoom();
  const r = z < 10 ? 2 : z < 12 ? 3 : 5;
  stopGroup.eachLayer(l => l.setRadius(r));
});

// ── Sidebar route list ─────────────────────────────────────────────────────
const routeList = document.getElementById('route-list');
const visibleCount = document.getElementById('visible-count');

function updateVisibleCount() {
  const n = routeLayers.filter(r => r.visible).length;
  visibleCount.textContent = n + ' visible';
}

function buildList(filter = '') {
  routeList.innerHTML = '';
  routeLayers.forEach((r, i) => {
    if (filter && !r.name.toLowerCase().includes(filter.toLowerCase())) return;
    const item = document.createElement('div');
    item.className = 'route-item' + (r.visible ? ' active' : '');
    // Determine contrasting text color for the brand badge
    const bc = r.brandColor || r.color;
    const hex = bc.replace('#','');
    const rr = parseInt(hex.substr(0,2),16), gg = parseInt(hex.substr(2,2),16), bb2 = parseInt(hex.substr(4,2),16);
    const lum = 0.2126*(rr/255) + 0.7152*(gg/255) + 0.0722*(bb2/255);
    const textCol = lum > 0.4 ? '#1a1a1a' : '#ffffff';
    item.innerHTML = `
      <span class="route-line-swatch" style="background:${r.color};box-shadow:0 0 5px ${r.color}88"></span>
      <span class="route-name" style="color:${r.color}">${r.name}</span>
      <span class="brand-badge" style="background:${bc};color:${textCol}">${bc}</span>
      <span class="route-toggle ${r.visible ? 'on' : ''}"></span>`;
    item.addEventListener('click', () => {
      r.visible = !r.visible;
      if (r.visible) { map.addLayer(r.layer); }
      else           { map.removeLayer(r.layer); }
      item.className = 'route-item' + (r.visible ? ' active' : '');
      item.querySelector('.route-toggle').className = 'route-toggle' + (r.visible ? ' on' : '');
      updateVisibleCount();
    });
    routeList.appendChild(item);
  });
}

buildList();

document.getElementById('filter-input').addEventListener('input', e => {
  buildList(e.target.value);
});
</script>
