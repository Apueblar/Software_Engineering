<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Edit Category', ~{::content})}">
<div th:fragment="content">
    <div class="form-container">
        <form th:action="@{|/category/edit/${category.id}|}" th:object="${category}" method="post">
            <label for="name">Name:</label>
            <input id="name" th:field="*{name}">
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

            <label for="code">Code:</label>
            <input id="code" th:field="*{code}">
            <div class="error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>

            <button type="submit">Save</button>
        </form>
    </div>

    <a href="/">Back</a>
</div>
</html>
