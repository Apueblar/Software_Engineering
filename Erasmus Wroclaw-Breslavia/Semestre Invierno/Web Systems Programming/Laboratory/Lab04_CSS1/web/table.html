<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="Table styling demo">
    <meta name="keywords" content="table, tr, td, nth-child">
    <title>Table — Styling tables</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="back" href="index.html">← Back</a>
    <main>
        <h1>Table styling</h1>
        <table class="styled-table">
            <thead>
                <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
            </thead>
            <tbody>
                <tr><td>Widget A</td><td>3</td><td>€9.99</td></tr>
                <tr><td>Widget B</td><td>1</td><td>€19.99</td></tr>
                <tr><td>Widget C</td><td>7</td><td>€2.50</td></tr>
            </tbody>
            <tfoot>
                <tr><td colspan="2">Total</td><td>€*</td></tr>
            </tfoot>
        </table>
    </main>
    <footer class="site-footer">
        <a class="back" href="index.html">← Back</a>
    </footer>
</body>
</html>
