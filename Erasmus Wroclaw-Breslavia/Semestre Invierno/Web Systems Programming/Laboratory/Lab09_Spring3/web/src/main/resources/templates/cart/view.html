<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Cart', ~{::content})}">
<div th:fragment="content" class="centered-container">

    <header class="section-header">
        <h2>Your Shopping Cart</h2>
        <p th:if="${cartCount > 0}" th:text="'Items in cart: ' + ${cartCount}">Items in cart: 0</p>
        <p th:if="${cartCount == 0}">Your cart is empty.</p>
    </header>

    <!-- SUCCESS -->
    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${!#lists.isEmpty(items)}">
        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Unit price</th>
                <th>Quantity</th>
                <th>Line total</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td>
                    <a th:href="@{|/product/${item.product.id}|}" th:text="${item.product.name}">Product name</a>
                    <div th:if="${item.product.description != null}" th:text="${item.product.description}">Description</div>
                </td>

                <td th:text="${#numbers.formatDecimal(item.product.price, 1, 'COMMA', 2, 'POINT')}">0.00</td>

                <td>
                    <!-- Update quantity: visible to authenticated non-admin users -->
                    <form th:action="@{|/cart/update/${item.product.id}|}" method="post" sec:authorize="isAuthenticated() and !hasAuthority('ROLE_ADMIN')" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="qty-input"/>
                        <button type="submit" class="small-btn button-primary">Update</button>
                    </form>

                    <!-- For admins or unauthenticated users show the quantity as plain text -->
                    <span sec:authorize="!isAuthenticated() or hasAuthority('ROLE_ADMIN')" th:text="${item.quantity}">1</span>
                </td>

                <td th:text="${#numbers.formatDecimal(item.lineTotal, 1, 'COMMA', 2, 'POINT')}">0.00</td>

                <td>
                    <!-- Remove item: visible to authenticated non-admin users -->
                    <form th:action="@{|/cart/remove/${item.product.id}|}" method="post" sec:authorize="isAuthenticated() and !hasAuthority('ROLE_ADMIN')" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="small-btn btn-outline">Remove</button>
                    </form>

                    <!-- If not allowed to remove show a small hint -->
                    <span sec:authorize="!isAuthenticated() or hasAuthority('ROLE_ADMIN')" style="color:#777; font-size:0.9rem; margin-left:8px;">
                        (login as client to edit)
                    </span>
                </td>
            </tr>
            </tbody>
        </table>

        <div>
            <p>Order total:
                <b th:text="${#numbers.formatDecimal(orderTotal, 1, 'COMMA', 2, 'POINT')}">0.00</b>
            </p>

            <div>
                <a th:href="@{ / }" class="button-link">Continue shopping</a>

                <!-- Buy now: only visible to ROLE_CLIENT or ROLE_USER (clients) -->
                <form th:action="@{/cart/buy}" method="post" sec:authorize="hasAnyAuthority('ROLE_CLIENT','ROLE_USER')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="button-link">Buy now</button>
                </form>

                <!-- If user can't buy show info / link to login -->
                <div sec:authorize="!hasAnyAuthority('ROLE_CLIENT','ROLE_USER')">
                    <span>
                        <span sec:authorize="isAuthenticated()">You must be a client to place orders.</span>
                        <span sec:authorize="!isAuthenticated()">Please <a th:href="@{/login}">login</a> as a client to buy.</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty cart fallback actions -->
    <div th:if="${#lists.isEmpty(items)}">
        <a th:href="@{ / }" class="button-link">Back to products</a>
    </div>

</div>
</html>
