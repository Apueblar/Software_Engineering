<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Sign up', ~{::content})}">
<div th:fragment="content" class="login-container">

    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/signin}" method="post" th:object="${signupForm}">
        <!-- CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label for="name">Name</label>
        <input id="name" type="text" th:field="*{name}" required />
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" required />
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}" required minlength="8"/>
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label>
            <input id="isAdmin" type="checkbox" th:field="*{admin}" />
            <span>Register as admin</span>
        </label>

        <button type="submit" style="margin-top:16px;">Create account</button>
    </form>

    <p>
        Already have an account? <a th:href="@{/login}">Login</a>
    </p>
</div>
</html>
