# ==============================
# = DATABASE CONFIG (MySQL)
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/resourcemanagementtest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC # To test on PC
spring.datasource.username=resuserTest
spring.datasource.password=ResUserTestPass123!
##spring.datasource.url=${SPRING_DATASOURCE_URL}
##spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
##spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# = JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=create-drop
###spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Force Spring Boot to always run data.sql
spring.sql.init.mode=always
# Inside resources folder
spring.sql.init.data-locations=classpath:init/data.sql
# Wait until JPA initialization is done
spring.jpa.defer-datasource-initialization=true
# If you want to log SQL parameters too:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# = DISABLE H2
spring.h2.console.enabled=false

# This ensures Spring Boot knows it's behind a proxy (correct IPs, HTTPS headers)
server.forward-headers-strategy=framework

# Disable Thymeleaf cache for tests
spring.thymeleaf.cache=false

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.g3.t1.resourcemanagement=DEBUG