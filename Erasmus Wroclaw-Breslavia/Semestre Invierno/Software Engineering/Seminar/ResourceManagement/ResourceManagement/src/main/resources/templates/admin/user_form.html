<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Create User - WUST Admin', ~{::body})}">
<div th:fragment="body">
    <main class="admin-form-page">
        <header class="form-header">
            <h1>👤 Create New User</h1>
            <p class="lead">Add a new user to the system with appropriate permissions and details.</p>
        </header>

        <form th:action="@{/admin/users}" th:object="${userForm}" method="post" class="admin-form" novalidate>
            <!-- Global form errors -->
            <div th:if="${#fields.hasErrors('global')}" class="alert alert-error" role="alert">
                <strong>Error!</strong>
                <ul>
                    <li th:each="err : ${#fields.errors('global')}" th:text="${err}">Error message</li>
                </ul>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Basic Information -->
            <section class="form-section">
                <h2 class="section-title">📋 Basic Information</h2>

                <div class="form-group">
                    <label for="name">Full Name <span class="required">*</span></label>
                    <input type="text" id="name" th:field="*{name}"
                           class="form-input" th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"
                           placeholder="John Doe" required maxlength="50" />
                    <span class="field-error" th:if="${#fields.hasErrors('name')}"
                          th:errors="*{name}">Error</span>
                    <span class="field-hint">Maximum 50 characters</span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" th:field="*{email}"
                           class="form-input" th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"
                           placeholder="john.doe@example.com" required />
                    <span class="field-error" th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}">Error</span>
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" th:field="*{password}"
                           class="form-input" th:classappend="${#fields.hasErrors('password')} ? 'error' : ''"
                           placeholder="Min. 6 characters" required />
                    <span class="field-error" th:if="${#fields.hasErrors('password')}"
                          th:errors="*{password}">Error</span>
                    <span class="field-hint">Minimum 6 characters</span>
                </div>

                <div class="form-group">
                    <label for="userType">User Type <span class="required">*</span></label>
                    <select id="userType" th:field="*{userType}"
                            class="form-select" th:classappend="${#fields.hasErrors('userType')} ? 'error' : ''"
                            required>
                        <option value="">Select user type...</option>
                        <option value="CLIENT">Client</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('userType')}"
                          th:errors="*{userType}">Error</span>
                </div>
            </section>

            <!-- Admin-specific fields -->
            <section class="form-section" id="adminFields" style="display: none;">
                <h2 class="section-title">🛡️ Admin Settings</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="adminLevel">Admin Level</label>
                        <input type="number" id="adminLevel" th:field="*{adminLevel}"
                               class="form-input" placeholder="10" min="1" max="100" />
                        <span class="field-hint">Typical: 10</span>
                    </div>

                    <div class="form-group">
                        <label for="departmentId">Department ID</label>
                        <input type="number" id="departmentId" th:field="*{departmentId}"
                               class="form-input" placeholder="1001" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="employeeCode">Employee Code</label>
                        <input type="text" id="employeeCode" th:field="*{employeeCode}"
                               class="form-input" placeholder="ADM001" />
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="adminActive" th:field="*{adminActive}" value="true" />
                            <span>Admin Active</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- Client-specific fields -->
            <section class="form-section" id="clientFields" style="display: none;">
                <h2 class="section-title">👥 Client Settings</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="clientType">Client Type</label>
                        <select id="clientType" th:field="*{clientType}" class="form-select">
                            <option value="">Select type...</option>
                            <option value="STANDARD">Standard</option>
                            <option value="PREMIUM">Premium</option>
                            <option value="VIP">VIP</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="maxActiveLoans">Max Active Loans</label>
                        <input type="number" id="maxActiveLoans" th:field="*{maxActiveLoans}"
                               class="form-input" placeholder="5" min="0" />
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="maxActiveReservations">Max Active Reservations</label>
                        <input type="number" id="maxActiveReservations" th:field="*{maxActiveReservations}"
                               class="form-input" placeholder="3" min="0" />
                    </div>

                    <div class="form-group">
                        <label for="blockedUntil">Blocked Until</label>
                        <input type="date" id="blockedUntil" th:field="*{blockedUntil}"
                               class="form-input" />
                        <span class="field-hint">Leave empty if not blocked</span>
                    </div>
                </div>
            </section>

            <!-- Form actions -->
            <div class="form-actions">
                <button type="submit" class="btn primary">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Create User
                </button>
                <a th:href="@{/admin}" class="btn neutral">Cancel</a>
            </div>
        </form>
    </main>

    <script th:src="@{/js/admin.js}" src="/js/admin.js" defer></script>
</div>
</html>
