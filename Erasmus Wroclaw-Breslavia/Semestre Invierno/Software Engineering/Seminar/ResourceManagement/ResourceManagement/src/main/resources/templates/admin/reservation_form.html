<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Create Reservation - WUST Admin', ~{::body})}">
<div th:fragment="body">
    <main class="admin-form-page">
        <header class="form-header">
            <h1>📅 Create New Reservation</h1>
            <p class="lead">Create a reservation for a user on their behalf.</p>
        </header>

        <form th:action="@{/admin/reservations}" th:object="${reservationForm}" method="post" class="admin-form" novalidate>
            <!-- Global form errors -->
            <div th:if="${#fields.hasErrors('global')}" class="alert alert-error" role="alert">
                <strong>Error!</strong>
                <ul>
                    <li th:each="err : ${#fields.errors('global')}" th:text="${err}">Error message</li>
                </ul>
            </div>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Reservation Details -->
            <section class="form-section">
                <h2 class="section-title">📋 Reservation Details</h2>

                <div class="form-group">
                    <label for="resourceId">Resource <span class="required">*</span></label>
                    <select id="resourceId" th:field="*{resourceId}"
                            class="form-select" th:classappend="${#fields.hasErrors('resourceId')} ? 'error' : ''"
                            required>
                        <option value="">Select a resource...</option>
                        <option th:each="resource : ${resources}"
                                th:value="${resource.id}"
                                th:text="${resource.getResourceType() == 'Book' ? resource.title + ' (Book)' : resource.name + ' (Room)'}"
                                th:disabled="${!resource.available}">
                            Resource Name
                        </option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('resourceId')}"
                          th:errors="*{resourceId}">Error</span>
                    <span class="field-hint">Only available resources are selectable</span>
                </div>

                <div class="form-group">
                    <label for="clientId">Client <span class="required">*</span></label>
                    <select id="clientId" th:field="*{clientId}"
                            class="form-select" th:classappend="${#fields.hasErrors('clientId')} ? 'error' : ''"
                            required>
                        <option value="">Select a client...</option>
                        <option th:each="user : ${users}"
                                th:value="${user.id}"
                                th:text="${user.name + ' (' + user.email + ')'}">
                            User Name (email)
                        </option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('clientId')}"
                          th:errors="*{clientId}">Error</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="startTime">Start Time <span class="required">*</span></label>
                        <input type="datetime-local" id="startTime" th:field="*{startTime}"
                               class="form-input" th:classappend="${#fields.hasErrors('startTime')} ? 'error' : ''"
                               required />
                        <span class="field-error" th:if="${#fields.hasErrors('startTime')}"
                              th:errors="*{startTime}">Error</span>
                    </div>

                    <div class="form-group">
                        <label for="endTime">End Time <span class="required">*</span></label>
                        <input type="datetime-local" id="endTime" th:field="*{endTime}"
                               class="form-input" th:classappend="${#fields.hasErrors('endTime')} ? 'error' : ''"
                               required />
                        <span class="field-error" th:if="${#fields.hasErrors('endTime')}"
                              th:errors="*{endTime}">Error</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" th:field="*{notes}"
                              class="form-textarea" th:classappend="${#fields.hasErrors('notes')} ? 'error' : ''"
                              rows="4" maxlength="2000"
                              placeholder="Optional notes about this reservation..."></textarea>
                    <span class="field-error" th:if="${#fields.hasErrors('notes')}"
                          th:errors="*{notes}">Error</span>
                    <span class="field-hint">Maximum 2000 characters</span>
                </div>
            </section>

            <!-- Preview section -->
            <section class="form-section preview-section">
                <h2 class="section-title">👁️ Preview</h2>
                <div class="preview-card">
                    <div class="preview-item">
                        <span class="preview-label">Resource:</span>
                        <span class="preview-value" id="preview-resource">Not selected</span>
                    </div>
                    <div class="preview-item">
                        <span class="preview-label">Client:</span>
                        <span class="preview-value" id="preview-client">Not selected</span>
                    </div>
                    <div class="preview-item">
                        <span class="preview-label">Duration:</span>
                        <span class="preview-value" id="preview-duration">-</span>
                    </div>
                </div>
            </section>

            <!-- Form actions -->
            <div class="form-actions">
                <button type="submit" class="btn primary">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Create Reservation
                </button>
                <a th:href="@{/admin}" class="btn neutral">Cancel</a>
            </div>
        </form>
    </main>

    <script th:src="@{/js/admin.js}" src="/js/admin.js" defer></script>
</div>
</html>
