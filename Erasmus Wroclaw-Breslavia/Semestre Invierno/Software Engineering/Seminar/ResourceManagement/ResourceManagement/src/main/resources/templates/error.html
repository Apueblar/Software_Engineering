<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout :: layout('Error - WUST Resource Management', ~{::body})}">
<div th:fragment="body">
    <section class="error-page">
        <div class="error-container">
            <!-- Error Icon -->
            <div class="error-icon">
                <span th:text="${errorIcon}">!</span>
            </div>

            <!-- Error Title -->
            <h1 class="error-title" th:text="${errorTitle}">Error</h1>

            <!-- Error Message -->
            <p class="error-message" th:text="${errorMessage}">
                An unexpected error occurred.
            </p>

            <!-- Optional Path Info -->
            <p class="error-path" th:if="${path}">
                <small>Requested path: <code th:text="${path}">/unknown</code></small>
            </p>

            <!-- Action Buttons -->
            <div class="error-actions">
                <a th:href="@{/}" class="btn primary">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Go Home
                </a>

                <button onclick="window.history.back()" class="btn secondary">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    Go Back
                </button>
            </div>

            <!-- Additional Help Text -->
            <div class="error-help">
                <p>If you believe this is a mistake, please contact support or try again later.</p>
            </div>
        </div>
    </section>
</div>

</html>
