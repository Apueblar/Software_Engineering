<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${resourceForm.id != null ? 'Edit Resource' : 'Create Resource'} + ' - WUST Admin', ~{::body})}">
<div th:fragment="body">
    <main class="admin-form-page">
        <header class="form-header">
            <h1 th:text="${resourceForm.id != null ? '✏️ Edit Resource' : '📦 Create New Resource'}">Create Resource</h1>
            <p class="lead" th:text="${resourceForm.id != null ? 'Update resource information.' : 'Add a new resource to the system.'}">Add a new resource</p>
        </header>

        <form th:action="${resourceForm.id != null ? '/admin/resources/' + resourceForm.id + '/edit' : '/admin/resources'}"
              th:object="${resourceForm}" method="post" class="admin-form" novalidate>
            <!-- Global form errors -->
            <div th:if="${#fields.hasErrors('global')}" class="alert alert-error" role="alert">
                <strong>Error!</strong>
                <ul>
                    <li th:each="err : ${#fields.errors('global')}" th:text="${err}">Error message</li>
                </ul>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" th:if="${resourceForm.id != null}" />
            <!-- Hidden field to preserve resourceType when disabled (editing mode) -->
            <input type="hidden" th:field="*{resourceType}" th:if="${resourceForm.id != null}" />

            <!-- Resource Type Selection -->
            <section class="form-section">
                <h2 class="section-title">📋 Resource Type</h2>

                <div class="form-group">
                    <label for="resourceType">Type <span class="required">*</span></label>
                    <select id="resourceTypeDisplay"
                            th:if="${resourceForm.id != null}"
                            class="form-select"
                            disabled>
                        <option th:selected="${resourceForm.resourceType == 'BOOK'}" value="BOOK">Book</option>
                        <option th:selected="${resourceForm.resourceType == 'ROOM'}" value="ROOM">Room</option>
                    </select>
                    <select id="resourceType"
                            th:if="${resourceForm.id == null}"
                            th:field="*{resourceType}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('resourceType')} ? 'error' : ''"
                            required>
                        <option value="">Select resource type...</option>
                        <option value="BOOK">Book</option>
                        <option value="ROOM">Room</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('resourceType')}"
                          th:errors="*{resourceType}">Error</span>
                    <span class="field-hint" th:if="${resourceForm.id != null}">Resource type cannot be changed after creation</span>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="available" th:field="*{available}" />
                        <span>Available for reservation/loan</span>
                    </label>
                </div>
            </section>

            <!-- Book-specific fields -->
            <section class="form-section" id="bookFields" style="display: none;">
                <h2 class="section-title">📚 Book Information</h2>

                <div class="form-group">
                    <label for="title">Title <span class="required">*</span></label>
                    <input type="text" id="title" th:field="*{title}"
                           class="form-input" th:classappend="${#fields.hasErrors('title')} ? 'error' : ''"
                           placeholder="The Great Gatsby" maxlength="255" />
                    <span class="field-error" th:if="${#fields.hasErrors('title')}"
                          th:errors="*{title}">Error</span>
                </div>

                <div class="form-group">
                    <label for="author">Author <span class="required">*</span></label>
                    <input type="text" id="author" th:field="*{author}"
                           class="form-input" th:classappend="${#fields.hasErrors('author')} ? 'error' : ''"
                           placeholder="F. Scott Fitzgerald" maxlength="255" />
                    <span class="field-error" th:if="${#fields.hasErrors('author')}"
                          th:errors="*{author}">Error</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="isbn">ISBN <span class="required">*</span></label>
                        <input type="text" id="isbn" th:field="*{isbn}"
                               class="form-input" th:classappend="${#fields.hasErrors('isbn')} ? 'error' : ''"
                               placeholder="978-3-16-148410-0" maxlength="17" />
                        <span class="field-error" th:if="${#fields.hasErrors('isbn')}"
                              th:errors="*{isbn}">Error</span>
                    </div>

                    <div class="form-group">
                        <label for="year">Year <span class="required">*</span></label>
                        <input type="number" id="year" th:field="*{year}"
                               class="form-input" th:classappend="${#fields.hasErrors('year')} ? 'error' : ''"
                               placeholder="1925" min="1450" max="2100" />
                        <span class="field-error" th:if="${#fields.hasErrors('year')}"
                              th:errors="*{year}">Error</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="copiesAvailable">Copies Available <span class="required">*</span></label>
                    <input type="number" id="copiesAvailable" th:field="*{copiesAvailable}"
                           class="form-input" th:classappend="${#fields.hasErrors('copiesAvailable')} ? 'error' : ''"
                           placeholder="5" min="0" />
                    <span class="field-error" th:if="${#fields.hasErrors('copiesAvailable')}"
                          th:errors="*{copiesAvailable}">Error</span>
                </div>
            </section>

            <!-- Room-specific fields -->
            <section class="form-section" id="roomFields" style="display: none;">
                <h2 class="section-title">🏢 Room Information</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="roomCode">Room Code <span class="required">*</span></label>
                        <input type="text" id="roomCode" th:field="*{roomCode}"
                               class="form-input" th:classappend="${#fields.hasErrors('roomCode')} ? 'error' : ''"
                               placeholder="A-101" maxlength="255" />
                        <span class="field-error" th:if="${#fields.hasErrors('roomCode')}"
                              th:errors="*{roomCode}">Error</span>
                    </div>

                    <div class="form-group">
                        <label for="name">Room Name <span class="required">*</span></label>
                        <input type="text" id="name" th:field="*{name}"
                               class="form-input" th:classappend="${#fields.hasErrors('name')} ? 'error' : ''"
                               placeholder="Conference Room A" maxlength="255" />
                        <span class="field-error" th:if="${#fields.hasErrors('name')}"
                              th:errors="*{name}">Error</span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="location">Location <span class="required">*</span></label>
                        <input type="text" id="location" th:field="*{location}"
                               class="form-input" th:classappend="${#fields.hasErrors('location')} ? 'error' : ''"
                               placeholder="Building A, 1st Floor" maxlength="255" />
                        <span class="field-error" th:if="${#fields.hasErrors('location')}"
                              th:errors="*{location}">Error</span>
                    </div>

                    <div class="form-group">
                        <label for="capacity">Capacity <span class="required">*</span></label>
                        <input type="number" id="capacity" th:field="*{capacity}"
                               class="form-input" th:classappend="${#fields.hasErrors('capacity')} ? 'error' : ''"
                               placeholder="20" min="1" />
                        <span class="field-error" th:if="${#fields.hasErrors('capacity')}"
                              th:errors="*{capacity}">Error</span>
                    </div>
                </div>
            </section>

            <!-- Form actions -->
            <div class="form-actions">
                <button type="submit" class="btn primary">
                    <svg class="icon" viewBox="0 0 24 24" fill="none">
                        <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span th:text="${resourceForm.id != null ? 'Update Resource' : 'Create Resource'}">Create</span>
                </button>
                <a th:href="@{/admin/resources}" class="btn neutral">Cancel</a>
            </div>
        </form>
    </main>

    <script th:src="@{/js/admin.js}" src="/js/admin.js" defer></script>
</div>
</html>
